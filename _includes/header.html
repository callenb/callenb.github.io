<header class="site-header">
  <div class="container">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main navigation">
        {% for topic in site.data.topics %}
          {% if topic.nav %}
          <a href="{{ topic.url }}" class="site-nav__link{% if page.url contains topic.url %} site-nav__link--active{% endif %}">{{ topic.title }}</a>
          {% endif %}
        {% endfor %}
        <a href="{{ '/about/' | relative_url }}" class="site-nav__link{% if page.url == '/about/' %} site-nav__link--active{% endif %}">About</a>
      </nav>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-drawer">
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
        <span class="nav-toggle__bar"></span>
      </button>
    </div>
  </div>
</header>
<div class="nav-drawer" id="nav-drawer" aria-hidden="true">
  <div class="container">
    {% for topic in site.data.topics %}
      {% if topic.nav %}
      <a href="{{ topic.url }}" class="nav-drawer__link">{{ topic.title }}</a>
      {% endif %}
    {% endfor %}
    <a href="{{ '/about/' | relative_url }}" class="nav-drawer__link">About</a>
  </div>
</div>
