<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <p class="footer-site-title">{{ site.title }}</p>
        <p class="footer-description">Writing about family history, genealogy, and the people worth remembering.</p>
        <a href="{{ '/feed.xml' | relative_url }}" class="footer-rss">RSS feed &rarr;</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-heading">Topics</p>
        <ul class="footer-links">
          {% for topic in site.data.topics %}
          <li><a href="{{ topic.url }}">{{ topic.title }}</a></li>
          {% endfor %}
        </ul>
      </div>
      <div class="footer-col">
        <p class="footer-col-heading">Elsewhere</p>
        <ul class="footer-links">
          <li><a href="https://www.wikitree.com/wiki/Callender-45" rel="noopener noreferrer">WikiTree</a></li>
          <li><a href="https://www.linkedin.com/in/barriecallender/" rel="noopener noreferrer">LinkedIn</a></li>
          <li><a href="https://github.com/callenb" rel="noopener noreferrer">GitHub</a></li>
        </ul>
      </div>
    </div>
    <p class="footer-copyright">&copy; Barrie Callender &middot; {{ site.time | date: '%Y' }}</p>
  </div>
</footer>
