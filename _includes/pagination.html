{% if paginator.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  <div class="pagination__inner">
    {% if paginator.previous_page %}
      <a href="{{ paginator.previous_page_path | relative_url }}" class="pagination__link pagination__link--prev">&larr; Newer posts</a>
    {% else %}
      <span class="pagination__link pagination__link--disabled">&larr; Newer posts</span>
    {% endif %}

    <span class="pagination__info">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>

    {% if paginator.next_page %}
      <a href="{{ paginator.next_page_path | relative_url }}" class="pagination__link pagination__link--next">Older posts &rarr;</a>
    {% else %}
      <span class="pagination__link pagination__link--disabled">Older posts &rarr;</span>
    {% endif %}
  </div>
</nav>
{% endif %}
