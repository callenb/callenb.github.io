---
layout: default
---
<section class="topic-hub">
  <div class="container">
    <header class="topic-hub__header">
      <h1 class="topic-hub__title">Posts tagged: {{ page.tag }}</h1>
    </header>
    <div class="topic-posts">
      {% for post in page.posts %}
        {% include post_card.html post=post size="small" %}
      {% endfor %}
    </div>
  </div>
</section>
