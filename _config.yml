title: Barrie Callender
tagline: My Jewish family history and other tales
email: barrie@callenb.org
description: >-
  Writing about family history, genealogy, and the Jewish family I discovered I had.
baseurl: ""
url: "https://callenb.org"
logo: /images/barrie_callender_400x400.jpg

author:
  name: Barrie Callender
  image: '/images/barrie_callender_400x400.jpg'
  avatar: '/images/barrie_callender_400x400.jpg'
  description: 'Writing about family history, genealogy, and the people worth remembering.'

twitter:
  username: callenb
  card: summary

social:
  name: Barrie Callender
  links:
    - https://www.linkedin.com/in/barriecallender
    - https://github.com/callenb

# Giscus comments — fill in repo_id and category_id from giscus.app
giscus:
  repo: callenb/callenb.github.io
  repo_id: PLACEHOLDER_REPO_ID
  category: General
  category_id: PLACEHOLDER_CATEGORY_ID
  mapping: pathname
  reactions_enabled: "1"
  emit_metadata: "0"
  theme: light

# Google Analytics
google_analytics: G-2GD92E3BV8

# Google Custom Search
google_cse_id: "009498214026621722719:ugb4jcwsnva"

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll/tagging
  - jekyll-last-modified-at
  - jekyll-hebcal

permalink: pretty

# Pagination
pagination:
  enabled: true
  debug: false
  collection: 'posts'
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - page :num'
  limit: 0
  sort_field: 'date'
  sort_reverse: true
  category: 'posts'
  tag: ''
  locale: ''
  trail:
    before: 2
    after: 2
  extension: html
  indexpage: 'index'

# Tags
tag_page_dir: tag
tag_page_layout: tag_page
tag_permalink_style: pretty

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Pages path
defaults:
  - scope:
      path: '_pages'
    values:
      permalink: /:basename:output_ext

include:
  - _pages

# Exclude Claude artefacts and tooling from processing
exclude:
  - .claude/
  - CLAUDE.md
  - .ruby-lsp
  - vendor/
  - Makefile
